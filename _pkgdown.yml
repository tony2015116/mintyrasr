url: https://tony2015116.github.io/mintyrasr/

# Same look as the mintyr site: Bootstrap 3 + cosmo, dark code blocks
template:
  #bootstrap: 5
  bootswatch: cosmo
  theme: arrow-dark            # syntax highlighting of code blocks

home:
  title: "mintyrasr: mintyr GBLUP Scenarios Directly in ASReml-R"
  description: >
    Fit single- and two-trait GBLUP models with ASReml-R to the nested
    parameter-estimation and cross-validation data built by mintyr:
    genetic parameters that follow the model, correct LRTs, and PA /
    accuracy / slope per fold - no input files to export.

navbar:
  structure:
    left:  [intro, reference, articles, cheatsheet, news]
    right: [search, github, discussions]
  components:
    cheatsheet:
      text: Cheatsheet
      icon: fas fa-file-alt
      aria-label: Cheatsheet
      menu:
      - text: English
        href: cheatsheet.html
      - text: 中文
        href: cheatsheet-zh.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/tony2015116/mintyrasr
      aria-label: GitHub
    discussions:
      icon: fas fa-users fa-lg
      href: https://github.com/tony2015116/mintyrasr/discussions
      aria-label: Discussions

# vignettes/mintyrasr.Rmd is the "Get started" page; every article has an
# English and a Chinese version, listed together (as in mintyr).
articles:
- title: Get started
  navbar: Get started
  contents:
  - mintyrasr
  - articles/mintyrasr-zh
- title: Models and relationship matrices
  navbar: Models and relationship matrices
  contents:
  - articles/models
  - articles/models-zh
  - articles/relationship-matrices
  - articles/relationship-matrices-zh
  - articles/other-models
  - articles/other-models-zh
- title: Genetic parameters across populations
  navbar: Genetic parameters across populations
  contents:
  - articles/parameters-by-group
  - articles/parameters-by-group-zh
  - articles/correlations-between-traits
  - articles/correlations-between-traits-zh
  - articles/same-trait-across-groups
  - articles/same-trait-across-groups-zh

reference:
- title: GBLUP with ASReml-R
  desc: >
    Parameter estimation and cross-validation for one scenario, or for all
    scenarios of mintyr::cv_scenarios() in one call.
  contents:
  - asr_gblup
  - asr_scenarios
- title: Comparing relationship matrices
  desc: Pedigree (A), genomic (G) and single-step (H) on the same folds.
  contents:
  - asr_compare

news:
  cran_dates: false
